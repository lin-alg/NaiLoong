name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Test data validator
        run: python -m unittest discover -s tests -v

      - name: Test search semantics
        run: node tests/search.test.js

      - name: Test GitHub image URL conversion
        run: node tests/ghimg.test.js

      - name: Test markdown renderer
        run: node tests/md.test.js

      - name: Test intro physics
        run: node tests/intro.test.js

      - name: Test resource loading recovery
        run: node tests/resources.test.js

      - name: Test visitor statistics
        run: node tests/stats.test.js

      - name: Validate repository data
        run: python scripts/validate_data.py

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deployment
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$CLOUDFLARE_DEPLOY_HOOK_URL"

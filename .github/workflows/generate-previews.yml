name: Generate Meme Previews

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: meme-preview-queue-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  pull-requests: read

jobs:
  generate:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate and publish previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_previews.py

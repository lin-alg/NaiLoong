name: Data Linter

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Test data validator
        run: python -m unittest discover -s tests -v

      - name: Test search semantics
        run: node tests/search.test.js

      - name: Test GitHub image URL conversion
        run: node tests/ghimg.test.js

      - name: Test markdown renderer
        run: node tests/md.test.js

      - name: Validate repository data
        run: python scripts/validate_data.py
